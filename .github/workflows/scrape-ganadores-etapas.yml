name: Scrape ganadores de etapa

on:
  schedule:
    - cron: '20 20 4-26 7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r porra-tour/scripts/requirements.txt

      - name: Run scraper
        run: python porra-tour/scripts/scrape_ganadores_etapas.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add porra-tour/src/data/ganadores_etapas.json porra-tour/src/data/ciclistas.json porra-tour/src/data/config.json
          git diff --cached --quiet || git commit -m "chore: actualizar ganadores de etapa"
          git push
